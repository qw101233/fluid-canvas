<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: radial-gradient(ellipse at 50% 100%, #131c36 0%, #070a14 60%);
    color: #eef2ff;
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }
  .head { margin-top: 120px; text-align: center; }
  .kicker { font-size: 32px; letter-spacing: 12px; color: #ffb08a; }
  h1 { margin-top: 24px; font-size: 88px; font-weight: 800; letter-spacing: 4px; }
  .main { margin-top: 66px; position: relative; }
  .main img {
    width: 980px; border-radius: 26px; display: block;
    border: 1px solid rgba(140,170,255,.3);
    box-shadow: 0 26px 90px rgba(0,0,0,.65);
  }
  .chip {
    position: absolute; right: -6px; top: -30px;
    background: linear-gradient(95deg, #2fae7d, #5fd8a8);
    color: #04281a; font-size: 30px; font-weight: 800; letter-spacing: 2px;
    padding: 14px 32px; border-radius: 999px;
    box-shadow: 0 8px 26px rgba(47,174,125,.45);
  }
  .stats { margin-top: 70px; width: 960px; display: flex; gap: 30px; }
  .st {
    flex: 1; background: rgba(255,255,255,.055); border: 1px solid rgba(140,170,255,.22);
    border-radius: 24px; padding: 38px 0 34px; text-align: center;
  }
  .st .v { font-size: 62px; font-weight: 800; color: #8fc0ff; }
  .st .v.o { color: #ffb08a; }
  .st .v.g { color: #7fe0b5; }
  .st .k { margin-top: 12px; font-size: 28px; color: #93a4c8; letter-spacing: 3px; }
  .git {
    margin-top: 72px; display: flex; align-items: center; gap: 22px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(140,170,255,.25);
    border-radius: 999px; padding: 26px 52px;
  }
  .git svg { width: 52px; height: 52px; fill: #eef2ff; }
  .git .u { font-size: 34px; letter-spacing: 2px; color: #cdd8f2; }
  .foot {
    position: absolute; bottom: 96px; width: 100%; text-align: center;
    font-size: 28px; color: #6d7ea6; letter-spacing: 4px;
  }
  .num { position: absolute; bottom: 40px; width: 100%; text-align: center;
    font-size: 26px; color: #46547a; letter-spacing: 6px; }
</style>
</head>
<body>
  <div class="head">
    <div class="kicker">最 终 效 果</div>
    <h1>流转于指尖的画布</h1>
  </div>

  <div class="main">
    <div class="chip">✔ 10/10 验证通过</div>
    <img src="../screenshots/demo-paint.png">
  </div>

  <div class="stats">
    <div class="st"><div class="v">782</div><div class="k">行 · 单文件零依赖</div></div>
    <div class="st"><div class="v o">60</div><div class="k">FPS 实时交互目标</div></div>
    <div class="st"><div class="v g">10/10</div><div class="k">自动化行为验证</div></div>
  </div>

  <div class="git">
    <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    <div class="u">github.com/qw101233/fluid-canvas</div>
  </div>

  <div class="foot">拖动喷射染料 · 点击放置墨滴 · 参数面板实时调校</div>
  <div class="num">03 / 03</div>
</body>
</html>
